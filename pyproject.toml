[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jade-blockchain"
version = "0.1.0"
description = "Demostración reproducible de eventos encadenados y anclaje"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "cffi==2.1.1",
    "pycparser==3.12",
]

[project.scripts]
jade = "jadeblock.cli:main"

[tool.setuptools.packages.find]
include = ["jadeblock*"]
